name: Build and push Docker image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      sdk_ref:
        description: PrintHub SDK branch or tag
        required: true
        default: feat/sdk-api-adoption

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout LabelArchitect
        uses: actions/checkout@v4
        with:
          path: workspace/LabelArchitect

      - name: Checkout matching PrintHub SDK
        uses: actions/checkout@v4
        with:
          repository: Hartmannlight/printhub-sdk
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.sdk_ref || github.ref_name }}
          path: workspace/printhub-sdk

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/labelarchitect
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: workspace
          file: workspace/LabelArchitect/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
